[package]
name = "multi-screen-recorder"
version = "1.0.1"
description = "Multi Screen Recorder - record multiple screens into one video"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
